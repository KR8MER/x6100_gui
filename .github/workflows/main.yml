name: Build image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create from this commit (empty: build only)'
        required: false
        default: ''
      full_build:
        description: 'Rebuild the whole system, ignoring the saved system build'
        type: boolean
        required: false
        default: false
  push:
    # Pattern matched against refs/tags
    tags:
      - '**'           # Push events to every tag

permissions:
  contents: write

env:
  # A pushed tag, or the tag requested on a manual run, names the image and release
  REL_NAME: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-22.04
    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: false
        docker-images: true
        swap-storage: true
    - name: check free space
      run: |
        df -h
        pwd
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout GUI
      uses: actions/checkout@v5
      with:
        submodules: true
        path: x6100_gui

    - name: Checkout buildroot
      uses: actions/checkout@v5
      with:
        submodules: true
        repository: KR8MER/AetherX6100Buildroot
        path: AetherX6100Buildroot

    - name: Patch GUI mk
      run: |
        sed -i "s,https://github.com/gdyuldin/x6100_gui,${GITHUB_WORKSPACE}/x6100_gui,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_SITE_METHOD = git,X6100_GUI_SITE_METHOD = local,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk
        sed -i "s,^X6100_GUI_GIT_SUBMODULES,# X6100_GUI_GIT_SUBMODULES,g" AetherX6100Buildroot/br2_external/package/x6100-gui/x6100_gui.mk

    # Saved builds are keyed on the Buildroot revision: a GUI-only change
    # reuses them, any change to the system (packages, kernel, config) does not
    - name: Buildroot revision
      id: br
      run: echo "rev=$(git -C AetherX6100Buildroot rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    # Source archives of every package, so they are not downloaded each run
    - name: Download cache
      uses: actions/cache@v5
      with:
        path: AetherX6100Buildroot/buildroot/dl
        key: br-dl-${{ steps.br.outputs.rev }}
        restore-keys: br-dl-

    # The built system (toolchain, libraries, kernel, everything but the GUI).
    # With it, a run only rebuilds the GUI and the image: minutes, not an hour.
    - name: Restore system build
      id: system
      if: ${{ !inputs.full_build }}
      uses: actions/cache/restore@v5
      with:
        path: AetherX6100Buildroot/build
        key: br-system-v2-${{ steps.br.outputs.rev }}

    # Ccache
    - name: Ccache cache files
      uses: actions/cache@v5
      with:
        path: ~/.buildroot-ccache
        key: ${{ runner.os }}-ccache-${{ github.sha }}
        restore-keys: |
          Linux-ccache-${{ github.sha }}
          Linux-ccache-
          ${{ runner.os }}-ccache-

    # Configure
    - name: Configure
      run: |
        cd AetherX6100Buildroot && bash ./br_config.sh

    # Build
    - name: Build
      id: build
      run: |
        full_build() {
          make lame
          make mpg123
          make libsndfile-dirclean
          make
          echo "fresh=true" >> "$GITHUB_OUTPUT"
        }
        cd AetherX6100Buildroot/build
        if [ "${{ steps.system.outputs.cache-hit }}" = "true" ]; then
          # The saved build is for this exact Buildroot revision, but the
          # checkout just gave every config file a new time, so make would
          # think each kconfig package (busybox, kernel, u-boot) needs
          # configuring again from sources that were trimmed away. Its
          # steps are all done: give every stamp one time, newer than the
          # checkout (one time for all, so no stamp is newer than the stamp
          # that depends on it).
          now=$(date +%s)
          find build -name '.stamp_*' -exec touch -d "@$now" {} +
          # Only the GUI changed: rebuild it from this checkout, then the image
          if ! { make x6100-gui-dirclean && make; }; then
            echo "::warning::The saved system build did not work; building everything"
            cd .. && rm -rf build && bash ./br_config.sh && cd build
            full_build
          fi
        else
          full_build
        fi

    # Replace U-boot
    - name: Replace u-boot
      run: |
        dd if=x6100_gui/u-boot/u-boot-sunxi-with-spl.bin of=AetherX6100Buildroot/build/images/sdcard.img seek=8K bs=1 conv=notrunc

    # Compress image
    - name: Compress image
      run: |
        mkdir -p out
        mv AetherX6100Buildroot/build/images/sdcard.img out/sdcard.${{ env.REL_NAME }}.img
        cd out
        zip sdcard.${{ env.REL_NAME }}.img.zip sdcard.${{ env.REL_NAME }}.img
        rm sdcard.${{ env.REL_NAME }}.img

    # Save the system build after a full build. Per-package sources and object
    # files are dropped: every package is already installed, and its stamp
    # files are all Buildroot needs to know that. Images made on every run
    # (root filesystem, SD image) are dropped too; the kernel, device tree and
    # boot loader images stay, as nothing would remake them.
    - name: Trim system build
      if: steps.build.outputs.fresh == 'true'
      run: |
        cd AetherX6100Buildroot/build
        # Kept too: what the steps make runs on every build (target-finalize)
        # read from a package's own folder. busybox lists its shells from its
        # .config, python3 compiles the target's .py files with Lib/compileall.
        # (linux runs depmod only when its .config is there; with it trimmed
        # that step is skipped, and the saved modules.dep is the one it made.)
        find build -mindepth 2 -maxdepth 2 ! -path 'build/buildroot-config/*' \
            ! -name '.stamp_*' ! -name '.files-list*' ! -name '.br_*' \
            ! -path 'build/busybox-*/.config' ! -path 'build/python3-*/Lib' \
            -exec rm -rf {} +
        rm -f images/rootfs.* images/sdcard*
        du -sh host target images build

    - name: Save system build
      if: steps.build.outputs.fresh == 'true'
      uses: actions/cache/save@v5
      with:
        path: AetherX6100Buildroot/build
        key: br-system-v2-${{ steps.br.outputs.rev }}

    # Keep the image on the run even if publishing the release fails, so a
    # rejected release never throws away a build.
    # The release tag is created on the commit this run built. GITHUB_TOKEN
    # cannot create a ref whose workflow files differ from the default branch,
    # so do not push workflow changes to main while a release build runs.
    - name: Upload image
      uses: actions/upload-artifact@v6
      with:
        name: sdcard.${{ env.REL_NAME }}.img.zip
        path: out/sdcard.${{ env.REL_NAME }}.img.zip
        compression-level: 0

    # Create release
    - name: Release
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
      with:
        tag_name: ${{ env.REL_NAME }}
        target_commitish: ${{ github.sha }}
        files: out/sdcard.${{ env.REL_NAME }}.img.zip
